<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sCoin Balance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Tab Navigation -->
        <div class="tab-navigation">
            <button class="tab-btn active" data-tab="balance">
                <svg class="tab-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 6V12L16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                Balance
            </button>
            <button class="tab-btn" data-tab="transfer">
                <svg class="tab-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M7 17L17 7M17 7H8M17 7V16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Transfer
            </button>
        </div>

        <!-- Balance Tab Content -->
        <div class="tab-content active" id="balance-tab">
            <div class="container">
                <div class="header">
                    <div class="icon-wrapper">
                        <img src="https://kappa.lol/gGL1cX" alt="sCoin" class="coin-icon">
                    </div>
                    <h1 class="title">sCoin Wallet</h1>
                </div>

                <div class="citizen-id-section">
                    <p class="citizen-id-label">Your Citizen ID</p>
                    <div class="citizen-id-display">
                        <span class="citizen-id-value" id="citizenId">Loading...</span>
                        <button class="copy-btn" id="copyCitizenBtn" title="Copy Citizen ID">
                            <svg class="copy-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M8 4V16C8 17.1046 8.89543 18 10 18H18C19.1046 18 20 17.1046 20 16V7.24162C20 6.7034 19.7831 6.18789 19.3982 5.81161L16.6569 3.11612C16.2715 2.73854 15.7448 2.52411 15.1962 2.52411H10C8.89543 2.52411 8 3.41954 8 4.52411V4Z" stroke="currentColor" stroke-width="2"/>
                                <path d="M16 18V20C16 21.1046 15.1046 22 14 22H6C4.89543 22 4 21.1046 4 20V9C4 7.89543 4.89543 7 6 7H8" stroke="currentColor" stroke-width="2"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="balance-section">
                    <p class="balance-label">Your Balance</p>
                    <div class="balance-display">
                        <span class="balance-amount" id="balance">0</span>
                        <span class="currency">sCoin</span>
                    </div>
                </div>

                <button class="refresh-btn" id="refreshBtn">
                    <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21 10C21 10 18.995 7.26822 17.3662 5.63824C15.7373 4.00827 13.4864 3 11 3C6.02944 3 2 7.02944 2 12C2 16.9706 6.02944 21 11 21C15.1031 21 18.5649 18.2543 19.6482 14.5M21 10V4M21 10H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Refresh Balance
                </button>

                <div class="info-section">
                    <div class="info-item">
                        <span class="info-label">Status</span>
                        <span class="info-value status-active">Active</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Transfer Tab Content -->
        <div class="tab-content" id="transfer-tab">
            <div class="container">
                <div class="header">
                    <h1 class="title transfer-title">Send sCoin</h1>
                    <p class="transfer-subtitle">Transfer sCoin to another player</p>
                </div>

                <div class="current-balance-small">
                    <span class="small-label">Available Balance:</span>
                    <span class="small-balance" id="transferBalance">0 sCoin</span>
                </div>

                <form class="transfer-form" id="transferForm">
                    <div class="form-group">
                        <label for="recipientId" class="form-label">Recipient Citizen ID</label>
                        <input 
                            type="text" 
                            id="recipientId" 
                            class="form-input" 
                            placeholder="Enter Citizen ID"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="amount" class="form-label">Amount</label>
                        <div class="amount-input-wrapper">
                            <input 
                                type="number" 
                                id="amount" 
                                class="form-input amount-input" 
                                placeholder="0"
                                min="1"
                                step="1"
                                required
                            >
                            <span class="amount-currency">sCoin</span>
                        </div>
                    </div>

                    <button type="submit" class="transfer-submit-btn" id="transferBtn">
                        <svg class="transfer-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L12 22M12 2L5 9M12 2L19 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Send sCoin
                    </button>
                </form>

                <div class="alert" id="transferAlert" style="display: none;">
                    <p class="alert-message" id="alertMessage"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
